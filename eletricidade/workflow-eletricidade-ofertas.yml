name: Eletricidade - atualizar ofertas (ERSE)

on:
  schedule:
    - cron: "17 6 * * *"
  push:
    paths:
      - "eletricidade/scripts/atualizar_ofertas.py"
      - ".github/workflows/eletricidade-ofertas.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 eletricidade/scripts/atualizar_ofertas.py
      - run: |
          git config user.name "lf-bot"
          git config user.email "bot@literaciafinanceira.pt"
          git add eletricidade/data/ofertas.json
          git commit -m "Eletricidade: ofertas da ERSE atualizadas" || echo "sem alterações"
          git pull --rebase
          git push
