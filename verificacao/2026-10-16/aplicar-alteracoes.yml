# Copiar para .github/workflows/aplicar-alteracoes.yml
#
# Dois trabalhos independentes:
#
# 1. "validar" corre sozinho em cada push a data/depositos.json. Se o ficheiro
#    violar as regras do TAREFA.md, o commit fica com visto vermelho. Também
#    apanha o caso de um depositos.json largado na raiz do repositório em vez
#    de em data/, que é um engano fácil no upload pelo site do GitHub e que
#    deixa o comparador a servir dados velhos sem ninguém reparar.
#
# 2. "aplicar" só corre quando carregas em Run workflow. É aí que está a tua
#    aprovação: escreve-se o patch em verificacao/<data>/alteracoes.json, tu
#    lês, e só depois mandas correr. Numa corrida ele aplica o patch, valida o
#    resultado, regenera o comparador-depositos.js e faz commit de tudo.
#    Se alguma coisa falhar, não grava nada.

name: Aplicar alterações aos depósitos

on:
  push:
    paths:
      - "data/depositos.json"
      - "depositos.json"
      - "scripts/validar_depositos.py"
  workflow_dispatch:
    inputs:
      patch:
        description: "Caminho do ficheiro de alterações (ex.: verificacao/2026-11-01/alteracoes.json)"
        required: true
        type: string
      dry_run:
        description: "Só mostrar o que mudaria, sem gravar"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  validar:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Nenhum depositos.json perdido na raiz
        run: |
          if [ -f depositos.json ]; then
            echo "::error file=depositos.json::Há um depositos.json na raiz do repositório. O ficheiro de dados é data/depositos.json: o comparador lê esse e ignora este. Abre o ficheiro da raiz, carrega no lápis e muda o nome para data/depositos.json, que o GitHub move-o."
            exit 1
          fi
          echo "OK: não há depositos.json na raiz."

      - name: Validar data/depositos.json
        run: python3 scripts/validar_depositos.py

  aplicar:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: O ficheiro de alterações existe
        run: |
          if [ ! -f "${{ inputs.patch }}" ]; then
            echo "::error::Não existe ${{ inputs.patch }}. Confirma o caminho."
            exit 1
          fi
          echo "----- ficheiro de alterações -----"
          cat "${{ inputs.patch }}"

      - name: Validar os dados antes de mexer
        run: python3 scripts/validar_depositos.py

      - name: Aplicar as alterações
        run: |
          python3 scripts/aplicar_alteracoes.py "${{ inputs.patch }}" \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Validar o resultado
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/validar_depositos.py

      - name: Regenerar o comparador
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/gerar_js.py

      - name: Gravar
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "lf-bot"
          git config user.email "bot@literaciafinanceira.pt"
          git add data/depositos.json comparador-depositos.js
          if git diff --cached --quiet; then
            echo "Sem alterações a gravar."
          else
            git commit -m "Aplicar ${{ inputs.patch }}"
            git push
          fi

      - name: Resumo
        run: |
          echo "### Alterações aplicadas" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 -c "import json;d=json.load(open('data/depositos.json'));print(len(d['depositos']),'depósitos, verificado em',d['meta']['data_verificacao'])" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
