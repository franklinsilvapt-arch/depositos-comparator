name: Gerar comparador-depositos.js

on:
  push:
    paths:
      - "data/depositos.json"
      - "scripts/comparador-template.js"
      - "scripts/gerar_js.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/gerar_js.py
      - run: |
          git config user.name "lf-bot"
          git config user.email "bot@literaciafinanceira.pt"
          git add comparador-depositos.js
          git commit -m "Gerar comparador-depositos.js a partir do JSON" || echo "sem alterações"
          git push
