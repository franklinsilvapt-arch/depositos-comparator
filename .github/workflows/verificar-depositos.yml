name: Verificar depósitos a prazo

on:
  schedule:
    - cron: "0 7 1,16 * *"   # dias 1 e 16 de cada mês, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl beautifulsoup4 pypdf
      - name: Correr verificação
        run: python3 scripts/verificar_depositos.py
      - name: Guardar relatório no repo
        run: |
          git config user.name "lf-bot"
          git config user.email "bot@literaciafinanceira.pt"
          git add verificacao/
          git commit -m "Verificação depósitos $(date +%Y-%m-%d)" || echo "nada a commitar"
          git push
      - name: Abrir issue com o relatório
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const mes = new Date().toISOString().slice(0,10);
            const body = fs.readFileSync(`verificacao/${mes}/relatorio.md`, 'utf8');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Depósitos a prazo: verificação ${mes}`,
              body: body.slice(0, 60000), labels: ['depositos', 'verificacao-mensal']
            });
