# Copiar para .github/workflows/aplicar-alteracoes.yml no repo savings-comparator.
#
# Porque existe: cada ronda de verificação produz um script de patch com guarda
# em verificacao/<AAAA-MM-DD>/apply.py. Sem este workflow, esse script só corre
# na máquina de alguém, e o resultado é o que aconteceu a 1 de novembro de 2026:
# o PR entrou em main e os dados ficaram na mesma, porque ninguém correu o script.
#
# Isto não decide nada. Aplica um script que já foi revisto e aprovado em PR.

name: Apply changes to accounts

on:
  workflow_dispatch:
    inputs:
      script:
        description: "Path to the apply script, e.g. verificacao/2026-11-01/apply.py"
        required: true
        type: string
      dry_run:
        description: "Only show what would change, write nothing"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: The script exists
        run: |
          if [ ! -f "${{ inputs.script }}" ]; then
            echo "::error::No such file: ${{ inputs.script }}. Check the path."
            exit 1
          fi
          echo "----- script -----"
          cat "${{ inputs.script }}"

      - name: Apply
        run: python3 "${{ inputs.script }}" ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Rebuild the comparator
        if: ${{ !inputs.dry_run }}
        run: python3 scripts/build.py

      - name: Commit
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name "lf-bot"
          git config user.email "bot@literaciafinanceira.pt"
          git add data/accounts.json savings-comparator.js
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "Apply ${{ inputs.script }}"
            git push
          fi
