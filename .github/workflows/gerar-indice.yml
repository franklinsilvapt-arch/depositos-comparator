name: Gerar índice de depósitos

on:
  push:
    paths:
      - "data/depositos.json"
      - "data/referencias.json"
      - "scripts/gerar_indice.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Guardar cópia datada da verificação
        run: |
          DATA=$(python3 -c "import json;print(json.load(open('data/depositos.json'))['meta']['data_verificacao'])")
          mkdir -p data/historico
          cp data/depositos.json "data/historico/$DATA.json"
      - run: python3 scripts/gerar_indice.py
      - run: |
          git config user.name "lf-bot"
          git config user.email "bot@literaciafinanceira.pt"
          git pull --rebase
          git add data/historico data/indice.json
          git commit -m "Índice: guardar verificação e gerar data/indice.json" || echo "sem alterações"
          git push
