name: Enviar emails de teste

# Envia um exemplo de cada email de alerta para o endereço indicado. Só corre à mão.
on:
  workflow_dispatch:
    inputs:
      email:
        description: Endereço que recebe os exemplos
        required: true

jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 scripts/enviar_teste.py
        env:
          MAILCHIMP_API_KEY: ${{ secrets.MAILCHIMP_API_KEY }}
          MAILCHIMP_LIST_ID: ${{ secrets.MAILCHIMP_LIST_ID }}
          MAILCHIMP_FROM: geral@literaciafinanceira.pt
